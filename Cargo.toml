[package]
name = "orrery-wm"
version = "0.1.0"
edition = "2024"
description = "A static tiling Wayland compositor on Smithay"

[lib]
name = "orrery_wm"

[[bin]]
name = "orrery"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "renderer_glow"] }
calloop = { version = "0.14.5", features = ["signals"] }
kdl = "6.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
anyhow = "1.0.104"
libc = "0.2.191"
# The nested windows' EGL surfaces (Smithay's winit backend uses it but does not re-export it).
wayland-egl = "0.32.11"

[dev-dependencies]
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }

# Dependencies (kdl, smithay, ...) optimised in dev builds: the parser-heavy tests run several times faster, and
# orrery's own code stays at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 2
