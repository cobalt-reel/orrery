[package]
name = "orrery-wm"
version = "0.1.0"
edition = "2024"
description = "A static tiling Wayland compositor on Smithay"
license = "MIT"
repository = "https://github.com/cobalt-reel/orrery"
readme = "README.md"
keywords = ["wayland", "compositor", "tiling", "window-manager", "smithay"]
categories = ["gui"]

[lib]
name = "orrery_wm"

[[bin]]
name = "orrery"
path = "src/main.rs"

[dependencies]
# Nested (winit), and bare metal: DRM/KMS, GBM buffers, libinput, the seat through libseat, udev for devices.
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit", "wayland_frontend", "desktop", "renderer_glow",
    "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev",
] }
calloop = { version = "0.14.5", features = ["signals"] }
kdl = "6.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
anyhow = "1.0.104"
libc = "0.2.191"
# The link's Noise handshake and transport; only the pure-Rust primitives `Noise_NNpsk0_25519_ChaChaPoly_BLAKE2s` needs.
# Zeroes the link's secret and key when dropped.
zeroize = "1.9.1"
snow = { version = "0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
# Cursor themes: finding and reading xcursor files.
xcursor = "0.3.11"
# The nested windows' EGL surfaces (Smithay's winit backend uses it but does not re-export it).
wayland-egl = "0.32.11"

[dev-dependencies]
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

# Dependencies (kdl, smithay, ...) optimised in dev builds: the parser-heavy tests run several times faster, and
# orrery's own code stays at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 2
