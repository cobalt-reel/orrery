# ~/.config/xdg-desktop-portal/orrery-portals.conf: which portal backends serve an orrery session
# (xdg-desktop-portal picks <desktop>-portals.conf by XDG_CURRENT_DESKTOP, lower-cased; see `man portals.conf`).
# The kitty desktop-ui kitten for file choosers and settings (light/dark), gtk for everything else, if installed.
# `kitten desktop-ui enable-portal`, run inside orrery, writes a file like this one itself.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=kitty
org.freedesktop.impl.portal.Settings=kitty
